blueprint:
  name: Paralelo Virtual - mcamtech V2.0
  description: >
    Mantém os switches/lights do grupo sincronizados. Reage só a
    acionamentos reais (físicos ou pelo app), ignora mudanças causadas
    pela própria automação e retornos de dispositivo indisponível.
  domain: automation
  input:
    entrada_switchs:
      name: Escolha os pontos de Iluminação
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

variables:
  entidades: !input entrada_switchs

triggers:
  - trigger: state
    entity_id: !input entrada_switchs
    from:
      - "on"
      - "off"
    to:
      - "on"
      - "off"

conditions:
  # Ignora mudanças causadas por automações (acaba com o ping-pong)
  - condition: template
    value_template: "{{ trigger.to_state.context.parent_id is none }}"

actions:
  # Comanda só quem está diferente, e nunca o próprio interruptor tocado
  - variables:
      alvos: >
        {{ expand(entidades)
           | rejectattr('entity_id', 'eq', trigger.entity_id)
           | rejectattr('state', 'eq', trigger.to_state.state)
           | map(attribute='entity_id') | list }}
  - condition: template
    value_template: "{{ alvos | count > 0 }}"
  - action: "homeassistant.turn_{{ trigger.to_state.state }}"
    target:
      entity_id: "{{ alvos }}"

mode: restart
max_exceeded: silent
